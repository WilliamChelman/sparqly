sources:
  # ADR-0052: an omitted `source` on /api/describe resolves to the default
  # source. The describe page lands with the picker cleared, so the registry
  # needs a default for the cold-landing describe to resolve (else
  # `no-default-multi`). alpha carries the seed `ex:bob` the describe e2e uses.
  - id: alpha
    glob: ./data/alpha.ttl
    default: true
  - id: beta
    glob: ./data/beta.ttl
  # Raw pass-through targets for the ADR-0047 diff-page gate. Never queried.
  - id: gamma
    glob: ./data/alpha.ttl
    storage: disk
  - id: delta
    endpoint: http://127.0.0.1:1/sparql
  # No file has ever matched this pattern, so /refs returns no-git-history.
  # Used by the picker e2e covering the explainer empty state (issue #378).
  - id: epsilon
    glob: ./data/never-existed-*.ttl

context:
  prefixes:
    ex: 'http://example.org/'
    rdf: 'http://www.w3.org/1999/02/22-rdf-syntax-ns#'
    rdfs: 'http://www.w3.org/2000/01/rdf-schema#'
